name: devsu-bank
services:
  clients-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clients
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bank-local-only}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["clients-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d clients"]
      interval: 3s
      timeout: 3s
      retries: 30
  accounts-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: accounts
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bank-local-only}
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["accounts-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d accounts"]
      interval: 3s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: bank
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-bank-local-only}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbit-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  clients-api:
    build:
      context: .
      args: { SERVICE: Clients }
    ports: ["127.0.0.1:5001:8080"]
    environment:
      ConnectionStrings__Database: Host=clients-db;Database=clients;Username=bank;Password=${DB_PASSWORD:-bank-local-only}
      Rabbit__Host: rabbitmq
      Rabbit__User: bank
      Rabbit__Password: ${RABBIT_PASSWORD:-bank-local-only}
    depends_on:
      clients-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped
  accounts-api:
    build:
      context: .
      args: { SERVICE: Accounts }
    ports: ["127.0.0.1:5002:8080"]
    environment:
      ConnectionStrings__Database: Host=accounts-db;Database=accounts;Username=bank;Password=${DB_PASSWORD:-bank-local-only}
      Rabbit__Host: rabbitmq
      Rabbit__User: bank
      Rabbit__Password: ${RABBIT_PASSWORD:-bank-local-only}
    depends_on:
      accounts-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped
volumes:
  clients-data:
  accounts-data:
  rabbit-data:
